name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.3.0"
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: apkrunner-windows-x64.exe
          - os: macos-15-intel
            asset: apkrunner-macos-intel.dmg
          - os: macos-latest
            asset: apkrunner-macos-apple-silicon.dmg
          - os: ubuntu-latest
            asset: apkrunner-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - run: pip install pyinstaller==6.11.1
      - run: pyinstaller --onefile --name apkrunner --paths . scripts/apkrunner_entry.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: copy dist\apkrunner.exe ${{ matrix.asset }}
      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg && cp dist/apkrunner dmg/
          cp README.md dmg/README.md
          hdiutil create -volname "Apk-Runner" -srcfolder dmg -ov -format UDZO ${{ matrix.asset }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cp dist/apkrunner ${{ matrix.asset }}
      - name: Smoke test
        if: runner.os != 'macOS'
        run: ./dist/apkrunner --version
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: dist/apkrunner --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Apk-Runner ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: assets/*
