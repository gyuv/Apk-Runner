name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.3.0"
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: apkrunner-windows-x64.exe
          - os: macos-15-intel
            asset: apkrunner-macos-intel.dmg
            raw: apkrunner-macos-intel
          - os: macos-latest
            asset: apkrunner-macos-apple-silicon.dmg
            raw: apkrunner-macos-apple-silicon
          - os: macos-latest
            asset: apkrunner-macos-universal.dmg
            raw: apkrunner-macos-universal
            pyi: --target-arch universal2
          - os: ubuntu-latest
            asset: apkrunner-linux-x64
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.pyi != '' && matrix.pyi != null }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m unittest discover -s tests -t .
      - run: pip install pyinstaller==6.11.1
      - run: python -c "from apkrunner.framework import build; build('apkrunner/framework.jar')"
      - run: pyinstaller --onefile ${{ matrix.pyi }} --name apkrunner --paths . --add-data "apkrunner/framework.jar${{ runner.os == 'Windows' && ';' || ':' }}apkrunner" scripts/apkrunner_entry.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: copy dist\apkrunner.exe ${{ matrix.asset }}
      - name: Build Apk-Runner.app (macOS)
        if: runner.os == 'macOS'
        run: |
          python scripts/make_icon.py icon.png
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s icon.png --out icon.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) icon.png --out icon.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns icon.iconset -o icon.icns
          pyinstaller --windowed --noconfirm ${{ matrix.pyi }} --name Apk-Runner --icon icon.icns --osx-bundle-identifier io.github.apkrunner --paths . --add-data "apkrunner/framework.jar:apkrunner" --distpath appdist --workpath appbuild scripts/apkrunner_entry.py
          PLIST=appdist/Apk-Runner.app/Contents/Info.plist
          VER=$(python -c 'import apkrunner; print(apkrunner.__version__)')
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" $PLIST
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" $PLIST
          codesign --force --deep -s - appdist/Apk-Runner.app
          appdist/Apk-Runner.app/Contents/MacOS/Apk-Runner --version
          lipo -info appdist/Apk-Runner.app/Contents/MacOS/Apk-Runner
      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg && cp dist/apkrunner dmg/
          cp -R appdist/Apk-Runner.app dmg/
          ln -s /Applications dmg/Applications
          cp README.md dmg/README.md
          hdiutil create -volname "Apk-Runner" -srcfolder dmg -ov -format UDZO ${{ matrix.asset }}
          cp dist/apkrunner ${{ matrix.raw }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cp dist/apkrunner ${{ matrix.asset }}
      - name: Smoke test
        if: runner.os != 'macOS'
        run: ./dist/apkrunner --version
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/apkrunner --version
          lipo -info dist/apkrunner
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.raw || matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Apk-Runner ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: assets/*
