[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apkrunner"
version = "0.4.0"
description = "Inspect, unpack and run Android apps on Windows, macOS (Intel and Apple Silicon) and Linux"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
apkrunner = "apkrunner.__main__:main"

[tool.setuptools]
packages = ["apkrunner"]
